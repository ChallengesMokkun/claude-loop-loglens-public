name: verify

on:
  pull_request:

jobs:
  verify-loop:
    runs-on: ubuntu-latest
    #SDK にセッション全体のタイムアウトはないため、＃ジョブ側の壁時計時間の上限が最後の安全網になる
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: "./src/.python-version"
      - name: Install dependencies
        run: pip install claude-agent-sdk pytest pytest-cov ruff
      - name: Run verification loop
        run: python ./src/verify_loop.py --max-turns 15 --max-budget 4.0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
